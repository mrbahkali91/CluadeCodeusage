# The origin: everything except the client, on a server you control.
#
# WHY THIS EXISTS SEPARATELY FROM platform/docker-compose.yml
# ----------------------------------------------------------
# That file is a laptop convenience: it runs the database and the engine and
# publishes them on loopback. This one is the deployed shape. Three differences
# matter, and each is a decision rather than a detail.
#
# 1. NOTHING PUBLISHES A PORT. Not the database, not the engine, not the API.
#    The only route in is `cloudflared`, which makes an OUTBOUND connection to
#    Cloudflare and receives requests over it. The server therefore needs no
#    inbound firewall rule, no public IP exposure and no TLS certificate of its
#    own, and a port scan of it finds nothing. A published port plus a firewall
#    rule would be one misconfiguration away from an open PostGIS.
#
# 2. THE API IS HERE. The laptop file predates it. Without the API the client
#    has nothing to talk to.
#
# 3. AUTH MUST BE CONFIGURED, NOT DEFAULTED. The laptop file hard-codes
#    SREOI_AUTH_DEV_MODE=1. Here it is an explicit variable with no default, so
#    deploying without deciding fails at startup instead of quietly publishing
#    a password issuer meant for a loopback interface.
#
# Usage:
#   cp .env.example .env    # fill it in; it holds real secrets
#   docker compose up -d --build

name: sreoi-origin

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      # `postgres` is the cluster superuser; the init script creates `sreoi`
      # NOSUPERUSER NOBYPASSRLS. PostgreSQL exempts superusers from row-level
      # security unconditionally, so an application role that is a superuser
      # would leave all sixteen tenant policies enforced against nobody.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: postgres
      SREOI_DB_ROLE: sreoi
      SREOI_DB_PASSWORD: ${SREOI_DB_PASSWORD:?set SREOI_DB_PASSWORD in .env}
      SREOI_DB_NAME: sreoi
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../../platform/docker/initdb:/docker-entrypoint-initdb.d:ro
    # No `ports:`. Reachable only from this compose network.
    healthcheck:
      # The application database, not the maintenance one: `pg_isready` on
      # `postgres` reports healthy before the init script has created anything.
      test: ["CMD-SHELL", "pg_isready -U postgres -d sreoi"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  engine:
    build:
      context: ../../platform
    environment:
      SREOI_DATABASE_URL: postgresql+psycopg://sreoi:${SREOI_DB_PASSWORD}@db:5432/sreoi
      # No default. Leave both unset and configure OIDC instead for anything
      # beyond a demo; the application refuses to start with both.
      SREOI_AUTH_DEV_MODE: ${SREOI_AUTH_DEV_MODE:-}
      SREOI_DEV_TOKEN_SECRET: ${SREOI_DEV_TOKEN_SECRET:-}
      SREOI_OIDC_ISSUER: ${SREOI_OIDC_ISSUER:-}
      SREOI_OIDC_AUDIENCE: ${SREOI_OIDC_AUDIENCE:-}
      SREOI_OIDC_JWKS_URL: ${SREOI_OIDC_JWKS_URL:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-2}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: deploy/origin/Dockerfile.api
    environment:
      SREOI_DATABASE_URL: postgresql://sreoi:${SREOI_DB_PASSWORD}@db:5432/sreoi
      SREOI_ENGINE_URL: http://engine:8000
      SREOI_API_HOST: 0.0.0.0
      SREOI_API_PORT: "3000"
      # 0.0.0.0 inside a container with no published port is still private to
      # the compose network. Binding loopback here would make the service
      # unreachable from cloudflared, which is a different container.
      #
      # One proxy hop: cloudflared. With this at 0 the sign-in throttle would
      # bucket every client under cloudflared's address and one user's failures
      # would lock out everyone. With it too high, a forged X-Forwarded-For from
      # the internet could impersonate an address and evict someone's lockout.
      SREOI_TRUST_PROXY: "1"
      SREOI_CORS_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN, e.g. https://bahkali-tek.com}
    depends_on:
      db:
        condition: service_healthy
      engine:
        condition: service_started
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    # `run` with a token needs no config file and no mounted credentials: the
    # token itself names the tunnel and carries its secret. Create the tunnel
    # in the Cloudflare dashboard, route the hostname to http://api:3000, and
    # paste the token here.
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?set CLOUDFLARE_TUNNEL_TOKEN in .env}
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:

[project]
name = "sreoi"
version = "0.1.0"
description = "Saudi Real Estate Opportunity Intelligence — Slice 1"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pyjwt[crypto]>=2.9",
    "email-validator>=2.2",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-randomly>=3.15",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    # Document intelligence: pdfminer.six reads page text, fpdf2 builds the
    # multi-page Arabic brochure fixture. See TRACK-B.md -- pdfminer.six needs
    # promoting to a runtime dependency before PDF ingestion ships.
    "pdfminer.six>=20240706",
    "fpdf2>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sreoi_domain", "src/sreoi_sources", "src/sreoi_persistence", "src/sreoi_api"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# En dashes are intentional typography in user-facing summaries.
"src/sreoi_agents/checkers.py" = ["RUF001"]
# Arabic real-estate vocabulary, Arabic-Indic numerals and the Arabic decimal
# separator are the subject matter here, not confusable typos.
"src/sreoi_agents/extraction.py" = ["RUF001"]
"src/sreoi_agents/documents.py" = ["RUF001"]
"src/sreoi_api/routers/extraction.py" = ["RUF001"]
"tests/fixtures/listings.py" = ["RUF001"]
"tests/fixtures/documents.py" = ["RUF001"]
"tests/test_extraction.py" = ["RUF001"]
"tests/test_documents.py" = ["RUF001"]
# Translation strings are single logical units; wrapping them hurts readability
# and makes diffs of catalogue changes unreadable.
"src/sreoi_api/i18n.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
plugins = []

[[tool.mypy.overrides]]
module = ["geoalchemy2.*", "alembic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning:sreoi_.*"]
